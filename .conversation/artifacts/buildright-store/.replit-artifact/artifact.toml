kind = "web"
previewPath = "/"
title = "BuildRight Hardware Store"
description = "A polished responsive hardware and building-materials ecommerce storefront inspired by the BuildRight reference design, with search, category browsing, wishlist, cart, product details, deals, and checkout UI."
version = "1.0.0"
id = "artifacts/buildright-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18542

[services.development]
run = "pnpm --filter @workspace/buildright-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/buildright-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/buildright-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18542"
BASE_PATH = "/"
